# configs/debug.yaml  — laptop / 4GB GPU smoke test
experiment_name: "illumination_diffusion_debug"
output_dir: "outputs/debug"
seed: 42

# ── Data ──────────────────────────────────────────────────────────────
data:
  underexposed_root: "real_underexposed"
  overexposed_root:  "real_overexposed"
  image_size: 128          # small for laptop
  num_workers: 0           # avoids multiprocessing issues on Windows/Mac

# ── Model ─────────────────────────────────────────────────────────────
model:
  base_channels: 32        # tiny model for debug
  channel_multipliers: [1, 2, 2, 2]
  num_res_blocks: 1
  attention_resolutions: [16]
  dropout: 0.0
  timesteps: 100           # fewer steps for speed
  prediction_type: "v_prediction"
  use_ema: false           # skip EMA on debug

# ── Training ──────────────────────────────────────────────────────────
training:
  batch_size: 1
  gradient_accumulation_steps: 1
  num_epochs: 2
  learning_rate: 1.0e-4
  lr_warmup_steps: 10
  save_every_n_epochs: 1
  log_every_n_steps: 5
  mixed_precision: "no"    # fp32 on laptop
  max_grad_norm: 1.0
  # Loss weights
  mse_weight: 1.0
  perceptual_weight: 0.0   # disable VGG on laptop to save VRAM
  use_wandb: false

# ── Inference ─────────────────────────────────────────────────────────
inference:
  num_inference_steps: 20
  ddim_eta: 0.0
