# ============================================================
# Depth-Aware Paired Luminance Diffusion — Config (split-domain)
# ============================================================
# Conditional DDPM on L channel, with depth conditioning.
#   input  = concat(noisy_target_L, source_L, depth) → 3 channels
#   output = predicted noise on target_L              → 1 channel
#
# A SINGLE model is trained per direction (overexposed OR underexposed).
# Run training twice with `domain: overexposed` and `domain: underexposed`
# to obtain two specialised checkpoints — this eliminates the leakage
# failure mode where one image showed both effects, and lets each model
# fully commit to its direction without a class embedding compromising
# the backbone weights.
#
# One-time setup before training:
#   python depth_estimator.py --input_dir <normal> --output_dir <depth>
#   python generate_pairs.py  --normal_dir <normal> --depth_dir <depth> \
#                             --output_dir <pairs> --num_variants 3
#
# Then train per domain:
#   python diffusion_train.py --config diffusion_config.yaml \
#       --domain underexposed --output_subdir under
#   python diffusion_train.py --config diffusion_config.yaml \
#       --domain overexposed  --output_subdir over

# ============================================================
# THE ONE KNOB FOR THIS RUN — flip this to switch directions.
# ============================================================
# 'underexposed' → train/infer the dark-cavity model.
# 'overexposed'  → train/infer the bright-near-tissue model.
#
# Pairs are generated for BOTH directions in a single
# `generate_pairs.py` run, so you don't have to regenerate
# data when switching. Each direction saves its checkpoints
# under  output.checkpoints_dir / <domain>/  automatically,
# so the two trainings won't overwrite each other.
#
# CLI override: pass `--domain overexposed` or
# `--domain underexposed` to either diffusion_train.py or
# diffusion_inference.py to override this field for one run.
domain: "underexposed"

# --- Data paths ---
data:
  #pairs_dir: "../../../projects/i2i_diff_aug_dep_v3/outputs/pairs"
  #normal_dir: "../../../data/datasets/edm_consolidated_dataset/consolidated_classified_dataset/normal_frames"
  #depth_dir:  "../../../projects/i2i_diff_aug_dep_v3/outputs/pairs/depth"
  
  #pairs_dir: "../../../projects/i2i_diff_aug_dep_v3_sep/outputs/pairs"
  #normal_dir: "../../../data/datasets/kvasir_classified/none"
  #depth_dir:  "../../../projects/i2i_diff_aug_dep_v3_sep/outputs/pairs/depth"
  
  pairs_dir: "../../../../projects/i2i_diff_hybrid_v1/outputs/pairs"
  normal_dir: "../../../../data/datasets/kvasir_classified/none_filtered"

  #normal_dir: "../../../../data/datasets/kvasir_classified/none"
  depth_dir:  "../../../../projects/i2i_diff_hybrid_v1/outputs/pairs/depth"

# --- Output paths ---
# Each per-domain training run writes into a sub-directory of `root`
# named after `domain` (overridable via --output_subdir).
output:
  root: "../../../../projects/i2i_diff_v3_with_hadepth/outputs"
  checkpoints_dir: "../../../../projects/i2i_diff_v3_with_hadepth/outputs/checkpoints"
  samples_dir: "../../../../projects/i2i_diff_v3_with_hadepth/outputs/samples"

# --- Image settings ---
image:
  size: 256

# --- Model ---
# 3 input channels: noisy target L + clean source L + depth
# num_class_embeds is intentionally null — we train one specialised model
# per direction, so there is no class to condition on. Forward calls pass
# class_labels=None.
model:
  in_channels: 3
  out_channels: 1
  block_out_channels: [64, 128, 192, 256]
  layers_per_block: 2
  down_block_types:
    - "DownBlock2D"
    - "DownBlock2D"
    - "DownBlock2D"
    - "AttnDownBlock2D"
  up_block_types:
    - "AttnUpBlock2D"
    - "UpBlock2D"
    - "UpBlock2D"
    - "UpBlock2D"
  num_class_embeds: null
  attention_head_dim: 16

  # FiLM modulation on 4-D depth stats [mean, std, p10, p90] → time-embed.
  # Last layer is zero-initialised so training starts identical to
  # the no-FiLM baseline. Toggle on after a first successful run.
  depth_film: false
  depth_film_hidden: 64

# --- Diffusion ---
diffusion:
  num_train_timesteps: 1000
  beta_schedule: "squaredcos_cap_v2"
  prediction_type: "epsilon"

# --- Training ---
training:
  epochs: 300
  batch_size: 4
  lr: 1.0e-4
  weight_decay: 1.0e-6
  grad_accum_steps: 1
  mixed_precision: true
  ema_decay: 0.9999
  num_workers: 4
  save_every_n_epochs: 10
  patience: 50

  # Robustness augmentations.
  gamma_jitter: 0.1
  depth_noise_sigma: 0.05   # bumped — stress-test against depth-estimator error

# --- Losses ---
losses:
  mse_weight: 1.0
  l1_weight: 0.5            # was 0.1 — direct x0 supervision now matters
  edge_weight: 0.05         # was 0.03

  # Min-SNR-γ MSE weighting (Hang et al. 2023). Without this, ε-prediction
  # MSE at low-t (high SNR) collapses in equivalent x0-loss weight, so the
  # model has no incentive to commit to the extreme dark/bright targets in
  # the supervision and instead regresses toward source. γ=5 is the value
  # the paper tunes to and is robust across tasks. Set to 1e6 to disable.
  min_snr_gamma: 5.0

  # Extreme-weighted L1 — single knob; the loss automatically uses
  # mode='dark' if domain='underexposed', mode='bright' if 'overexposed'.
  # Heavily upweights pixels at the target's extreme to crush the
  # mean-regression bias responsible for "barely noticeable" effects.
  extreme_weight: 2.0       # was 0.5 — dominant now that min-SNR opened low-t
  extreme_alpha:  5.0
  extreme_tau:    0.3

  # Depth-gradient consistency — keeps exposure falloff aligned with geometry.
  depth_grad_weight: 0.05
  dgrad_margin:      0.1

  # SNR gating for x0-space aux losses. Bumped to 0.75 so the dark/bright
  # signal reaches a larger fraction of timesteps without triggering the
  # high-t fp16-instability.
  aux_max_t_frac: 0.75

# --- Chroma attenuation (post-hoc, non-learned) ---
# Two symmetric tweaks:
#   • Dark side (under): sat_floor pushed near zero and depth_chroma_boost
#     increased so deep tissue reads as near-monochrome. Without this the
#     residual warm AB on a darkened L renders as brown/gray, not black.
#   • Bright side (over): highlight_knee lowered from 90 → 78 and
#     highlight_desat raised from 0.60 → 0.80 so over-bright tissue reads
#     as blown-out white, not "warm bright". Mirror of the dark fix.
chroma:
  sat_knee:           5.0
  sat_full:          40.0
  sat_floor:          0.05
  depth_chroma_boost: 0.45
  highlight_desat:    0.80
  highlight_knee:    78.0
  purkinje_b_shift:   2.0
  purkinje_threshold: 25.0

# --- Texture-gate post-process (recombination) ---
# Attenuates the original high-frequency texture in regions where the
# predicted L_low is at an extreme. Without this, re-adding L_high_orig
# brings mid-tone variance back into the deepest cores and undoes the
# darkening / brightening — the dominant cause of "weak" effects.
texture_gate:
  knee:  30.0   # ramp width in L units
  floor: 0.05   # min HF multiplier in deepest extreme

# --- Content mask (UI / letterbox passthrough) ---
# Endoscopy frames have UI panels and circular FOV masks. The model has
# no useful conditioning on those pure-black regions and outputs noise
# there. We detect the valid scene area from the original RGB and force
# everything outside it to the original pixels.
content_mask:
  enable:         true
  luma_threshold: 8.0   # Rec.601 luma below which a pixel is 'border'
  erode_iter:     2     # erode the boundary slightly to avoid edge bleed

# --- Focal blend (force underexposure to stay in deep zones only) ---
# Was a band-aid for the model leaking the effect onto near tissue when it
# wasn't depth-aware enough. With min-SNR-γ training the depth-awareness
# now lives inside the model itself (the supervision targets already
# encode it), so this depth-driven α blend is redundant. Re-enable as a
# safety net only if a fresh checkpoint still leaks effect into shallow
# regions.
focal_blend:
  enable:       false
  gamma:        1.6   # lower = wider effect zone
  knee:         0.0   # no dead-zone — even the slightly-far tissue darkens
  floor:        0.0   # min α; 0 = fully suppress effect on near tissue
  smooth_sigma: 4.0   # gaussian smoothing of α (px at 512px ref)

# --- Analytic floor (definitive strength clamp on the model output) ---
# Was the regression-to-mean band-aid: clamp the model's L against the
# analytic depth-aware target so it could only DEEPEN, never weaken. With
# min-SNR-γ training the model commits to extremes on its own, so this
# clamp is the dominant reason the old "raw" output was barely darker than
# source while the "full" output was strong. Disabled so the diffusion
# model is the source of truth. Re-enable as a mild safety net (with
# weaker shift_magnitude/core_clip_blend) if a fresh checkpoint under-
# darkens the deepest cavities.
analytic_floor:
  enable:                false
  shift_magnitude_under: 85.0   # max L drop applied in deep cavity
  shift_magnitude_over:  70.0   # max L lift applied near light source
  gamma_under:           1.7    # lower = wider underexposure zone
  gamma_over:            1.5
  core_threshold:        0.5    # influence above which L is forced toward 0/100
  core_clip_blend:       0.97   # 1.0 → pure black/white in core; 0.0 → no extra pull
  hf_kill:               0.97   # fraction of original HF removed at peak influence
  smooth_sigma_base:     6.0    # gaussian smoothing of depth mask (px at 512px ref)

# --- Inference ---
inference:
  num_inference_steps: 50
  batch_size: 1

# --- Logging ---
logging:
  use_wandb: false
  wandb_project: "depth-aware-exposure-diffusion"
  wandb_entity: null
