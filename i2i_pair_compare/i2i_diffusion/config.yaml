data:
  pairs_root: "../../../../projects/i2i_diff_hybrid_v1/outputs/pairs"
  resolution: 256
  num_workers: 2
  flip_prob: 0.5
  drop_class_prob: 0.1
  val_fraction: 0.05
  split_seed: 1234
  val_batch_size: 8
  val_max_batches: 0    # 0 = use entire val set; set >0 to cap for speed
  val_t_grid: [50, 250, 500, 750, 950]   # fixed timesteps used during validation
  target_type: L          # 'L' = predict L_target (current); 'delta' = predict L_target - L_normal (stronger shifts; requires retrain)

model:
  base_channels: 64
  channel_mult: [1, 2, 2, 4]
  num_res_blocks: 2
  attn_resolutions: [32, 16]
  dropout: 0.1
  num_classes: 2

diffusion:
  num_timesteps: 1000
  schedule: cosine
  prediction: epsilon

training:
  batch_size: 8
  lr: 1.0e-4
  weight_decay: 0.0
  warmup_steps: 500
  total_steps: 200000
  ema_decay: 0.9999
  grad_clip: 1.0
  amp: true
  log_every: 100
  sample_every: 5000
  ckpt_every: 5000
  val_every: 5000
  out_dir: "../../../../projects/i2i_diff_hybrid_v1/outputs"
  resume: null
  reset_ema_on_resume: false   # set true to wipe EMA shadow and restart warmup on resume

inference:
  ckpt: "../../../../projects/i2i_diff_hybrid_v1/outputs/best.pt"
  num_sampling_steps: 25
  scheduler: ddim
  resolution: 256
  use_residual: true
  guidance_scale: 1.5
  mask_strategy: hybrid     # match what generate_pairs.py used; also used for --save_raw viz
  vignette_threshold: 5.0      # L below this = camera mask (excluded from augmentation)
