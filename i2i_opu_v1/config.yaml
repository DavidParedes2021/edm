# ============================================================
# Luminance Diffusion — Exposure Augmentation Pipeline
# ============================================================

# --- Data paths ---
data:
  normal_dir: "../../../data/datasets/edm_consolidated_dataset/consolidated_classified_dataset/normal_frames" 
  overexposed_dir: "../../../data/datasets/edm_consolidated_dataset/consolidated_classified_dataset/overexposed_frames"
  underexposed_dir: "../../../data/datasets/edm_consolidated_dataset/consolidated_classified_dataset/underexposed_frames"

# --- Output paths ---
output:
  root: "../../../projects/i2i_opu_v1/outputs"
  checkpoints_dir: "../../../projects/i2i_opu_v1/outputs/checkpoints"
  samples_dir: "../../../projects/i2i_opu_v1/outputs/samples"

# --- Image settings ---
image:
  size: 256            # Training resolution (256 keeps 4 GB VRAM safe)
  color_space: "LAB"   # LAB | YCbCr (LAB recommended)

# --- Model ---
model:
  in_channels: 1       # L channel only
  out_channels: 1
  block_out_channels: [64, 128, 256, 256]
  layers_per_block: 2
  down_block_types:
    - "DownBlock2D"
    - "DownBlock2D"
    - "AttnDownBlock2D"
    - "AttnDownBlock2D"
  up_block_types:
    - "AttnUpBlock2D"
    - "AttnUpBlock2D"
    - "UpBlock2D"
    - "UpBlock2D"
  num_class_embeds: 3   # 0=overexposed, 1=underexposed, 2=unconditional(null)
  attention_head_dim: 32

# --- Diffusion ---
diffusion:
  num_train_timesteps: 1000
  beta_schedule: "squaredcos_cap_v2"  # cosine schedule — better for images
  prediction_type: "epsilon"

# --- Training ---
training:
  epochs: 300
  batch_size: 8              # raise to 8-16 on DGX
  lr: 1.0e-4
  weight_decay: 1.0e-6
  grad_accum_steps: 1
  mixed_precision: true      # fp16
  ema_decay: 0.9999
  cfg_dropout_prob: 0.1      # classifier-free guidance dropout
  num_workers: 4
  save_every_n_epochs: 10    # sample generation interval
  patience: 50               # early stopping patience (epochs w/o val improvement)

# --- Losses ---
losses:
  mse_weight: 1.0
  perceptual_weight: 0.05     # VGG perceptual on L channel (light)
  edge_weight: 0.02           # Sobel edge loss for sharpness

# --- Inference (SDEdit) ---
inference:
  noise_strength: 0.45        # fraction of T to add (0.3-0.6)
  guidance_scale: 10.0        # CFG scale  (7-15 for strong effect)
  num_inference_steps: 50     # DDIM steps
  batch_size: 1

# --- Logging ---
logging:
  use_wandb: false
  wandb_project: "exposure-diffusion"
  wandb_entity: null
