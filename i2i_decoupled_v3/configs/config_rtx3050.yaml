# =============================================================================
# RTX 3050 (4GB VRAM) - Conservative configuration
# =============================================================================

data:  # 817 underexposed frames (unpaired reference)
  normal_dir: "../curated_edm2020_classified/normal_frames"   
  overexposed_dir: "../curated_edm2020_classified/overexposed_frames"  
  underexposed_dir: "../curated_edm2020_classified/underexposed_frames" 
  image_size: 128            # 128 for 4GB; step up to 256 only on DGX
  use_lab_space: true
  augment: true

model:
  in_channels: 1
  out_channels: 1
  base_channels: 64
  channel_mult: [1, 2, 3, 4]
  attention_resolutions: [8]
  num_res_blocks: 1
  dropout: 0.1
  num_classes: 2
  use_fp16: true

diffusion:
  timesteps: 1000
  beta_schedule: "cosine"
  ddim_steps: 50
  ddim_eta: 0.0
  classifier_free_guidance_scale: 5.0
  snr_gamma: 5.0
  aux_loss_t_frac: 0.35

training:
  batch_size: 2
  gradient_accumulation_steps: 16
  learning_rate: 5.0e-5
  num_epochs: 300
  warmup_steps: 500
  mixed_precision: true
  grad_clip: 1.0
  lambda_diffusion: 1.0
  lambda_perceptual: 0.1
  lambda_exposure: 0.8
  lambda_structure: 0.2
  cfg_dropout_prob: 0.15

checkpoint:
  output_dir: "./outputs_local"
  checkpoint_dir: "./outputs_local/checkpoints"
  samples_dir: "./outputs_local/samples"
  save_every_n_epochs: 20
  log_every_n_steps: 100

wandb:
  enabled: false
  project: "illum-diffusion"
  run_name: "rtx3050-v2-snr"