# config.yaml  v3 — conditioning-collapse + exposure fixes

data:
  normal_dir: "../../../data/datasets/edm_consolidated_dataset/consolidated_classified_dataset/normal_frames" 
  overexposed_dir: "../../../data/datasets/edm_consolidated_dataset/consolidated_classified_dataset/overexposed_frames"
  underexposed_dir: "../../../data/datasets/edm_consolidated_dataset/consolidated_classified_dataset/underexposed_frames" 
  image_size: 256            # Training resolution (use 512 for DGX)
  use_lab_space: true        # Apply diffusion only on L channel (LAB)
  augment: true

model:
  in_channels: 1
  out_channels: 1
  base_channels: 128
  channel_mult: [1, 2, 3, 4]
  attention_resolutions: [16, 8]
  num_res_blocks: 2
  dropout: 0.1
  num_classes: 2
  use_fp16: true

diffusion:
  timesteps: 1000
  beta_schedule: "cosine"
  ddim_steps: 100            # increased: 50 → 100 for better denoising quality
  ddim_eta: 0.0
  classifier_free_guidance_scale: 5.0
  snr_gamma: 5.0
  aux_loss_t_frac: 0.45      # raised: 0.35 → 0.45 (more aux training signal)

training:
  batch_size: 4
  gradient_accumulation_steps: 8
  learning_rate: 5.0e-5
  num_epochs: 300
  warmup_steps: 1000
  mixed_precision: true
  grad_clip: 1.0
  lambda_diffusion: 1.0
  lambda_perceptual: 0.1
  lambda_exposure: 1.5       # raised: 0.8 → 1.5 (label-driven, stronger signal)
  lambda_structure: 0.3
  cfg_dropout_prob: 0.15

checkpoint:
  output_dir: "../../../projects/i2i_decoupled_v3_3/t2/outputs"
  checkpoint_dir: "../../../projects/i2i_decoupled_v3_3/t2/outputs/checkpoints"
  samples_dir: "../../../projects/i2i_decoupled_v3_3/t2/outputs/samples"
  save_every_n_epochs: 1      # Save sample images every epoch
  log_every_n_steps: 50

wandb:
  enabled: false
  project: "illum-diffusion"
  run_name: "v3-cond-fix"