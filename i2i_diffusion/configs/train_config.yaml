# ── DGX single GPU 16 GB  ─────────────────────────────────────────────────────
#
# Architecture notes
# ------------------
# block_out_channels = model_channels × channel_mult = 64×[1,2,4,8]
#                    = (64, 128, 256, 512)
#
# Attention is restricted to the two deepest stages (spatial res ≤ 32px):
#   stage 2: 32×32  →  1 024 tokens  — safe
#   stage 3: 16×16  →    256 tokens  — safe
#   stage 0/1: 128×128 / 64×64  — NO attention (too large)
#
# class_embed_dim=256 keeps the cross-attention KV projection small.
# effective batch = batch_size × gradient_accumulation_steps = 2×4 = 8.
#
data:
  # normal_dir:  "../edm2020_classified_sample/normal_frames"
  # over_dir:    "../edm2020_classified_sample/overexposed_frames"
  # under_dir:   "../edm2020_classified_sample/underexposed_frames"
  normal_dir:  "../../../data/datasets/ead_2020_classified/edm2020_classified/normal_frames"
  over_dir:    "../../../data/datasets/ead_2020_classified/edm2020_classified/overexposed_frames"
  under_dir:   "../../../data/datasets/ead_2020_classified/edm2020_classified/underexposed_frames"
  image_size:  256
  num_workers: 4

model:
  unet:
    in_channels:        4
    out_channels:       3
    model_channels:     96        # 96×[1,2,4,4] = (96,192,384,384) — more capacity
    channel_mult:       [1, 2, 4, 4]
    attention_resolutions: [32, 16]
    num_res_blocks:     2
    dropout:            0.1
    num_classes:        2
    class_embed_dim:    256
  controlnet:
    enabled:            true
    in_channels:        1
    out_channels:       64
    num_layers:         3
  discriminator:
    ndf:                32
    n_layers:           2

diffusion:
  num_train_timesteps: 1000
  beta_schedule:       "linear"
  beta_start:          0.0001
  beta_end:            0.02
  prediction_type:     "epsilon"
  clip_sample:         false

training:
  output_dir:          "runs"
  run_name:            "illum_dgx16"
  seed:                42
  mixed_precision:     "fp16"

  optimizer:           "adamw"
  lr:                  2.0e-4     # increased from 1e-4 — helps convergence early
  lr_scheduler:        "cosine"
  warmup_steps:        200        # reduced from 500 — reach full lr faster
  weight_decay:        1.0e-2
  grad_clip:           1.0

  batch_size:          2            # 2 per micro-step
  gradient_accumulation_steps: 4   # effective batch = 8
  num_epochs:          200
  save_every:          10
  eval_every:          5
  log_every:           50

  gradient_checkpointing:  true
  cycle_start_epoch:       20
  identity_start_epoch:    10
  perceptual_every:        2

  lambda_perc:         0.10
  lambda_ssim:         0.05
  lambda_cycle:        10.0
  lambda_adv:          1.0
  lambda_identity:     5.0

  ema:
    enabled:           true
    decay:             0.9999

inference:
  ddim_steps:          50
  guidance_scale:      5.0
  eta:                 0.0
  batch_size:          2

logging:
  wandb:
    enabled:           true
    project:           "illum-diffusion"
    entity:            null
  log_images_every:    10