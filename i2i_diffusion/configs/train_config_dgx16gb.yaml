# ── DGX single GPU 16 GB config ──────────────────────────────────────────────
data:
  normal_dir:  "data/raw/normal"
  over_dir:    "data/raw/over"
  under_dir:   "data/raw/under"
  image_size:  256
  num_workers: 4

model:
  unet:
    in_channels:        4
    out_channels:       3
    model_channels:     64          # 64×[1,2,4,8] = (64,128,256,512)
    channel_mult:       [1, 2, 4, 8]
    attention_resolutions: [16, 8]
    num_res_blocks:     2
    dropout:            0.1
    num_classes:        2
    class_embed_dim:    512
  controlnet:
    enabled:            true
    in_channels:        1
    out_channels:       64
    num_layers:         3
  discriminator:
    ndf:                32          # lighter patch discriminator
    n_layers:           2

diffusion:
  num_train_timesteps: 1000
  beta_schedule:       "linear"
  beta_start:          0.0001
  beta_end:            0.02
  prediction_type:     "epsilon"
  clip_sample:         false

training:
  output_dir:          "runs"
  run_name:            "illum_dgx16"
  seed:                42
  mixed_precision:     "fp16"

  optimizer:           "adamw"
  lr:                  1.0e-4
  lr_scheduler:        "cosine"
  warmup_steps:        500
  weight_decay:        1.0e-2
  grad_clip:           1.0

  batch_size:          4            # 4 fits comfortably on 16 GB
  gradient_accumulation_steps: 2   # effective batch = 8
  num_epochs:          200
  save_every:          10
  eval_every:          5
  log_every:           50

  # Memory knobs
  gradient_checkpointing:  true    # recompute activations on backward
  cycle_start_epoch:       20      # delay cycle loss — saves ~2 fwd passes early
  identity_start_epoch:    10      # delay identity loss
  perceptual_every:        2       # compute perceptual loss every N steps (expensive)

  lambda_perc:         0.10
  lambda_ssim:         0.05
  lambda_cycle:        10.0
  lambda_adv:          1.0
  lambda_identity:     5.0

  ema:
    enabled:           true
    decay:             0.9999

inference:
  ddim_steps:          50
  guidance_scale:      5.0
  eta:                 0.0
  batch_size:          2

logging:
  wandb:
    enabled:           true
    project:           "illum-diffusion"
    entity:            null
  log_images_every:    10
