# ── Laptop 4 GB config ────────────────────────────────────────────────────────
# Intended for smoke-testing / debugging only — not full training.
# No cycle loss, no perceptual loss, no discriminator: pure diffusion MSE + SSIM.
data:
  normal_dir:  "data/raw/normal"
  over_dir:    "data/raw/over"
  under_dir:   "data/raw/under"
  image_size:  128             # half resolution
  num_workers: 2

model:
  unet:
    in_channels:        4
    out_channels:       3
    model_channels:     32     # 32×[1,2,4,4] = (32,64,128,128) — tiny
    channel_mult:       [1, 2, 4, 4]
    attention_resolutions: [8]
    num_res_blocks:     1
    dropout:            0.0
    num_classes:        2
    class_embed_dim:    128
  controlnet:
    enabled:            false  # disabled to save VRAM
    in_channels:        1
    out_channels:       32
    num_layers:         2
  discriminator:
    ndf:                16
    n_layers:           1

diffusion:
  num_train_timesteps: 1000
  beta_schedule:       "linear"
  beta_start:          0.0001
  beta_end:            0.02
  prediction_type:     "epsilon"
  clip_sample:         false

training:
  output_dir:          "runs"
  run_name:            "illum_laptop_debug"
  seed:                42
  mixed_precision:     "fp16"

  optimizer:           "adamw"
  lr:                  1.0e-4
  lr_scheduler:        "cosine"
  warmup_steps:        100
  weight_decay:        1.0e-2
  grad_clip:           1.0

  batch_size:          1
  gradient_accumulation_steps: 4   # effective batch = 4
  num_epochs:          10           # just for smoke-testing
  save_every:          5
  eval_every:          2
  log_every:           10

  # Memory knobs — most expensive losses disabled on 4 GB
  gradient_checkpointing: true
  cycle_start_epoch:   999   # effectively disabled
  identity_start_epoch: 999  # effectively disabled
  perceptual_every:    999   # effectively disabled

  lambda_perc:         0.0   # disabled
  lambda_ssim:         0.05
  lambda_cycle:        0.0   # disabled
  lambda_adv:          0.0   # disabled
  lambda_identity:     0.0   # disabled

  ema:
    enabled:           false  # saves a deepcopy

inference:
  ddim_steps:          20
  guidance_scale:      5.0
  eta:                 0.0
  batch_size:          1

logging:
  wandb:
    enabled:           false
  log_images_every:    2
