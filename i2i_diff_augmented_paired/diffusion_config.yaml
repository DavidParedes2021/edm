# ============================================================
# Paired Luminance Diffusion — Config
# ============================================================
# Train on paired data generated by exposure_augment.py
# Architecture: conditional DDPM (Palette-style)
#   input  = concat(noisy_target_L, source_L) → 2 channels
#   output = predicted noise on target_L       → 1 channel

# python generate_pairs.py --normal_dir ../../../data/datasets/edm_consolidated_dataset/consolidated_classified_dataset/normal_frames --output_dir ../../../projects/i2i_aug_diff_v1/t1/outputs/pairs --strength 0.85 --shift_magnitude 50.0

# --- Data paths ---
data:
  pairs_dir: "../../../projects/i2i_aug_diff_v1/t1/outputs/pairs"          # generated by generate_pairs.py
  normal_dir: "../../../data/datasets/edm_consolidated_dataset/consolidated_classified_dataset/normal_frames"        # original RGB images for inference

# --- Output paths ---
output:
  root: "../../../projects/i2i_aug_diff_v1/t1/outputs"
  checkpoints_dir: "../../../projects/i2i_aug_diff_v1/t1/outputs/checkpoints"
  samples_dir: "../../../projects/i2i_aug_diff_v1/t1/outputs/samples"

# --- Image settings ---
image:
  size: 256

# --- Model ---
# Palette-style: 2 input channels (noisy target L + clean source L)
model:
  in_channels: 2
  out_channels: 1
  block_out_channels: [64, 128, 192, 256]
  layers_per_block: 2
  down_block_types:
    - "DownBlock2D"
    - "DownBlock2D"
    - "DownBlock2D"
    - "AttnDownBlock2D"
  up_block_types:
    - "AttnUpBlock2D"
    - "UpBlock2D"
    - "UpBlock2D"
    - "UpBlock2D"
  num_class_embeds: 2    # 0=overexposed, 1=underexposed
  attention_head_dim: 16

# --- Diffusion ---
diffusion:
  num_train_timesteps: 1000
  beta_schedule: "squaredcos_cap_v2"
  prediction_type: "epsilon"

# --- Training ---
training:
  epochs: 300
  batch_size: 4
  lr: 1.0e-4
  weight_decay: 1.0e-6
  grad_accum_steps: 1
  mixed_precision: true
  ema_decay: 0.9999
  num_workers: 4
  save_every_n_epochs: 10
  patience: 50

# --- Losses ---
losses:
  mse_weight: 1.0
  edge_weight: 0.03      # Sobel edge on x0-estimate vs target
  l1_weight: 0.1         # L1 on x0-estimate vs target (sharper than MSE alone)

# --- Inference ---
inference:
  num_inference_steps: 50
  batch_size: 1

# --- Logging ---
logging:
  use_wandb: false
  wandb_project: "paired-exposure-diffusion"
  wandb_entity: null
